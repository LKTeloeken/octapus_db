[package]
name = "octapus_db"
version = "0.1.0-beta.16"
description = "Cliente de banco de dados desktop para PostgreSQL, MongoDB e Redis"
authors = ["LKTeloeken"]
license = "MIT OR Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "octapus_db_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Database
# `column_decltype` expõe o tipo declarado das colunas (Statement::columns),
# usado pelo adapter do SQLite para o front escolher o editor da célula.
rusqlite = { version = "0.31", features = ["bundled", "column_decltype"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
deadpool-postgres = "0.14"
mongodb = "3"
json5 = "0.4"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "tokio-native-tls-comp"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
postgres-native-tls = "0.5"
native-tls = "0.2"

# Secrets vault (device-bound encryption at rest)
aes-gcm = "0.10"
rand = "0.8"

# Utils
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sqlparser = "0.58"

# Catálogo de metadados (src/catalog): busca fuzzy, snapshot binário compacto e
# compressão em Rust puro (sem C) para o arquivo persistido.
nucleo-matcher = "0.3"
postcard = { version = "1", default-features = false, features = ["use-std"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
# Índice do interner do catálogo (HashTable guarda só o id de cada nome). Já
# vinha como dependência transitiva — mesma versão do lockfile.
hashbrown = { version = "0.15", default-features = false }
# Consumir o streaming de linhas do tokio-postgres (introspecção do catálogo).
# Já era dependência transitiva — mesma versão do lockfile.
futures-util = "0.3"

# Auto-update (só desktop; o updater não existe em mobile)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
# Canal beta (commands/updater.rs): listar as releases na API do GitHub. Mesmas
# versões e features que o plugin do updater já usa — nenhuma crate nova.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"

# macOS: esconder os botões nativos da barra (o front desenha os seus).
# Mesmas versões que o Tauri já usa, para não duplicar crates.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }

[dev-dependencies]
# Testes de propriedade do núcleo do catálogo (1.7: as mais novas sobem o
# bitflags do app inteiro no lockfile)
proptest = "1.7"
