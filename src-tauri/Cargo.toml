[package]
name = "octapus_db"
version.workspace = true
description = "Cliente de banco de dados desktop para PostgreSQL, MongoDB e Redis"
authors = ["LKTeloeken"]
license = "MIT OR Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "octapus_db_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
# O núcleo sem Tauri: adapters, catálogo, storage, serviços e assistente
octapus-core = { path = "../crates/octapus-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"

# HTTP: canal beta do updater (commands/updater.rs, API do GitHub). Mesmas
# versões e features que o plugin do updater já usa.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
semver = "1"
# Provedor de criptografia do rustls para o cliente do updater (mesma versão
# e features do núcleo)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
chrono = { version = "0.4", features = ["serde"] }

# Log do app em arquivo (pasta de logs do SO, com rotação) — ver lib.rs
log = "0.4"
tauri-plugin-log = "2"

# Auto-update (só desktop; o updater não existe em mobile)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# macOS: esconder os botões nativos da barra (o front desenha os seus).
# Mesmas versões que o Tauri já usa, para não duplicar crates.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
