<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rodadas do experimento</title>
<!--
  A tela das rodadas (serve.rs). Só lê o que a rodada gravou: não há botão que
  inicie, pare ou altere nada. Página única, sem dependência externa (funciona
  sem rede). Todo texto que vem dos arquivos entra por textContent, nunca como
  HTML: a consulta gerada por um modelo é dado, não marcação.
  Cores: os tokens do Ink (DESIGN.md), copiados porque a página é servida
  fora do app.
-->
<style>
:root {
  --bg: oklch(0.955 0.004 265); --surface-1: oklch(0.995 0.001 265); --surface-2: oklch(0.975 0.003 265);
  --line-subtle: oklch(0 0 0 / 6%); --line: oklch(0 0 0 / 10%); --line-strong: oklch(0 0 0 / 18%);
  --fg: oklch(0.22 0.012 265); --fg-muted: oklch(0.44 0.014 265); --fg-subtle: oklch(0.5 0.014 265);
  --iris: oklch(0.52 0.18 282); --iris-text: oklch(0.5 0.18 282); --iris-soft: oklch(0.55 0.18 282 / 10%);
  --success: oklch(0.5 0.13 158); --success-soft: oklch(0.6 0.13 158 / 12%);
  --warning: oklch(0.52 0.12 70); --warning-soft: oklch(0.75 0.14 75 / 18%);
  --danger: oklch(0.53 0.19 25); --danger-soft: oklch(0.6 0.19 25 / 10%);
  --track: oklch(0 0 0 / 7%);
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: oklch(0.165 0.006 265); --surface-1: oklch(0.2 0.007 265); --surface-2: oklch(0.228 0.008 265);
    --line-subtle: oklch(1 0 0 / 5.5%); --line: oklch(1 0 0 / 8.5%); --line-strong: oklch(1 0 0 / 15%);
    --fg: oklch(0.95 0.004 265); --fg-muted: oklch(0.76 0.01 265); --fg-subtle: oklch(0.7 0.012 265);
    --iris: oklch(0.62 0.16 282); --iris-text: oklch(0.77 0.12 282); --iris-soft: oklch(0.66 0.15 282 / 16%);
    --success: oklch(0.76 0.14 158); --success-soft: oklch(0.76 0.14 158 / 14%);
    --warning: oklch(0.82 0.13 78); --warning-soft: oklch(0.82 0.13 78 / 14%);
    --danger: oklch(0.72 0.17 22); --danger-soft: oklch(0.7 0.17 22 / 14%);
    --track: oklch(1 0 0 / 9%);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--sans); }
button, select, input { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--surface-1); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
h1 { font-size: 15px; font-weight: 600; margin: 0 8px 0 0; }
h2 { font-size: 13px; font-weight: 600; margin: 20px 0 8px; }
h3 { font-size: 12px; font-weight: 600; margin: 14px 0 6px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .04em; }
select, input[type=search] { background: var(--surface-1); border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 8px; min-height: 30px; }
select:focus-visible, input:focus-visible, button:focus-visible, tr:focus-visible { outline: 2px solid var(--iris); outline-offset: 1px; }
main { padding: 0 20px 40px; max-width: 1500px; margin: 0 auto; }
.muted { color: var(--fg-muted); } .subtle { color: var(--fg-subtle); }
.mono { font-family: var(--mono); font-size: 12px; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; border: 1px solid transparent; }
.badge.ok { background: var(--success-soft); color: var(--success); }
.badge.bad { background: var(--danger-soft); color: var(--danger); }
.badge.warn { background: var(--warning-soft); color: var(--warning); }
.badge.info { background: var(--iris-soft); color: var(--iris-text); }
.badge.plain { border-color: var(--line-strong); color: var(--fg-muted); }
#progress { display: grid; grid-template-columns: repeat(6, minmax(110px, 1fr)); gap: 10px; margin: 16px 0 6px; }
.tile { background: var(--surface-1); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.tile .label { color: var(--fg-muted); font-size: 12px; }
.tile .value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; margin: 4px 0 14px; }
.meter > div { height: 100%; background: var(--iris); border-radius: 3px; transition: width .3s ease; }
nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-top: 8px; }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--fg-muted); }
nav button[aria-selected=true] { color: var(--fg); border-bottom-color: var(--iris); font-weight: 600; }
.card { background: var(--surface-1); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 10px 0; }
.card .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.steps { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
.step { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--fg-subtle); font-size: 12px; }
.step.done { color: var(--fg-muted); background: var(--surface-2); }
.step.now { background: var(--iris-soft); color: var(--iris-text); border-color: var(--iris); font-weight: 600; }
pre { margin: 6px 0; padding: 8px 10px; background: var(--surface-2); border: 1px solid var(--line-subtle); border-radius: 6px; font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow: auto; }
pre.error { background: var(--danger-soft); border-color: transparent; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line-subtle); vertical-align: top; }
th { font-weight: 600; color: var(--fg-muted); font-size: 12px; white-space: nowrap; background: var(--surface-2); position: sticky; top: 0; }
th.sortable { cursor: pointer; user-select: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tablewrap { background: var(--surface-1); border: 1px solid var(--line); border-radius: 8px; overflow: auto; }
tbody tr.row { cursor: pointer; }
tbody tr.row td { white-space: nowrap; }
tbody tr.row:hover { background: var(--surface-2); }
tbody tr.selected { background: var(--iris-soft); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 10px; align-items: center; }
.filters input[type=search] { min-width: 240px; flex: 1; }
.question { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#detail { position: fixed; top: 0; right: 0; bottom: 0; width: min(920px, 92vw); background: var(--bg); border-left: 1px solid var(--line-strong); box-shadow: -12px 0 40px oklch(0 0 0 / 18%); overflow: auto; padding: 16px 20px 40px; z-index: 5; }
#detail[hidden] { display: none; }
#detail .close { float: right; background: var(--surface-1); border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px 16px; margin: 10px 0; }
.meta div span { display: block; color: var(--fg-muted); font-size: 12px; }
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
.sides .tablewrap { max-height: 420px; }
.sides td, .sides th { font-family: var(--mono); font-size: 12px; padding: 4px 8px; }
tr.missing td { background: var(--danger-soft); }
tr.extra td { background: var(--warning-soft); }
td.mark { width: 20px; color: var(--fg-muted); }
.bar { display: flex; align-items: center; gap: 8px; min-width: 150px; }
.bar .track { flex: 1; height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--iris); border-radius: 0 4px 4px 0; }
.bar .pct { width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
.empty { padding: 28px; text-align: center; color: var(--fg-muted); }
label.check { display: inline-flex; gap: 5px; align-items: center; }
details { margin: 8px 0; } summary { cursor: pointer; color: var(--fg-muted); }
.desk { display: grid; grid-template-columns: minmax(340px, 5fr) 7fr; gap: 16px; align-items: start; margin-top: 14px; }
.list { background: var(--surface-1); border: 1px solid var(--line); border-radius: 8px; max-height: calc(100vh - 150px); overflow: auto; }
.item { padding: 8px 12px; border-bottom: 1px solid var(--line-subtle); cursor: pointer; }
.item:hover { background: var(--surface-2); } .item.selected { background: var(--iris-soft); }
.item .head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.switch { display: flex; gap: 4px; margin-bottom: 8px; }
.switch button, .btn { background: var(--surface-1); border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 12px; cursor: pointer; min-height: 30px; }
.switch button[aria-pressed=true] { background: var(--iris-soft); border-color: var(--iris); color: var(--iris-text); font-weight: 600; }
.btn.primary { background: var(--iris); border-color: var(--iris); color: white; font-weight: 600; }
.btn.danger { color: var(--danger); } .btn:disabled { opacity: .5; cursor: default; }
.form { background: var(--surface-1); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.form label { display: block; color: var(--fg-muted); font-size: 12px; margin: 10px 0 3px; }
.form input[type=text], .form textarea, .form select { width: 100%; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 8px; }
.form textarea { font: 12px/1.5 var(--mono); resize: vertical; min-height: 54px; }
.form textarea.prose { font: inherit; }
.form .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.form .actions { display: flex; gap: 8px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
.note { padding: 8px 10px; border-radius: 6px; margin: 8px 0; }
.note.bad { background: var(--danger-soft); } .note.warn { background: var(--warning-soft); } .note.ok { background: var(--success-soft); } .note.info { background: var(--surface-2); }
.note ul { margin: 4px 0 0 18px; padding: 0; }
@media (max-width: 900px) { .desk { grid-template-columns: 1fr; } .form .row { grid-template-columns: 1fr 1fr; } }
@media (max-width: 900px) { #progress { grid-template-columns: repeat(3, 1fr); } .sides { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Rodadas do experimento</h1>
  <label class="muted" for="run">Rodada</label>
  <select id="run"></select>
  <span id="status"></span>
  <span class="subtle" id="signal"></span>
</header>
<main>
  <div id="progress"></div>
  <div class="meter" role="progressbar" aria-label="Progresso da rodada"><div id="meter" style="width:0"></div></div>
  <nav role="tablist" id="tabs"></nav>
  <section id="view"></section>
</main>
<aside id="detail" hidden></aside>

<script>
'use strict';

// ── Rótulos ────────────────────────────────────────────────────────────────
const STATUS = { answered: 'respondido', clarification: 'esclarecimento', exhausted: 'esgotado', failed: 'falhou',
  code_delivered: 'código entregue', replied: 'resposta em texto', cancelled: 'interrompido', not_opened: 'não abriu', open: 'aberto' };
const ROUND = { running: ['em andamento', 'info'], finished: ['concluída', 'ok'], interrupted: ['interrompida', 'warn'],
  stopped_on_errors: ['parada por erros', 'bad'] };
const STAGES = [['generating', 'Gerando'], ['validating', 'Validando'], ['executing', 'Executando'], ['comparing', 'Comparando']];
const STAGE_EXTRA = { preparing: 'Preparando a conversa e o contexto', waiting: 'Aguardando o provedor' };
const KIND = { query: 'consulta', clarification: 'esclarecimento', ask_user: 'pergunta ao usuário',
  structure_request: 'pedido de estrutura', answer: 'resposta em texto', code: 'código' };
const FAILED_AT = { guard: 'guard', preflight: 'preflight', execution: 'execução' };
const MISMATCH = { truncated: 'resultado incompleto', column_count: 'número de colunas', column_names: 'nomes das colunas',
  row_count: 'número de linhas', values: 'valores', order: 'ordem das linhas' };
const DIMENSIONS = [['paradigm', 'Paradigma'], ['model', 'Modelo'], ['language', 'Idioma'], ['difficulty', 'Dificuldade']];
const TABS = [['live', 'Ao vivo'], ['results', 'Resultados'], ['summary', 'Agregado'], ['run', 'Rodada'], ['questions', 'Perguntas']];
const PARADIGMS = ['postgres', 'mongodb', 'redis'];

// ── Estado ─────────────────────────────────────────────────────────────────
const state = {
  runs: [], run: null, tab: 'live', manifest: null, gold: new Map(), live: null,
  units: new Map(), order: [], next: 0, selected: null,
  filters: { paradigm: '', model: '', language: '', difficulty: '', verdict: '', text: '' },
  sort: { key: 'order', dir: 1 }, by: ['paradigm', 'model', 'language'], summary: null, summaryFor: '',
};

// ── DOM sem HTML ───────────────────────────────────────────────────────────
function h(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value == null || value === false) continue;
    if (key === 'class') node.className = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else if (key === 'style') node.style.cssText = value;
    else node.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    node.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  return node;
}
const $ = (id) => document.getElementById(id);
const replace = (node, ...children) => { node.replaceChildren(...children.flat().filter(Boolean)); };
const badge = (kind, text, title) => h('span', { class: 'badge ' + kind, title }, text);
const seconds = (ms) => (ms == null ? '-' : (ms / 1000).toFixed(1) + ' s');
const percent = (value) => (value == null ? '-' : (value * 100).toFixed(1) + '%');
function duration(total) {
  if (total == null) return '-';
  const hours = Math.floor(total / 3600), minutes = Math.floor((total % 3600) / 60), rest = Math.round(total % 60);
  return hours ? `${hours} h ${minutes} min` : minutes ? `${minutes} min ${rest} s` : `${rest} s`;
}
function verdict(record) {
  if (record.correctFinal && record.correctFirst) return badge('ok', '✓ acerto', 'Acertou sem correção');
  if (record.correctFinal) return badge('ok', '✓ após correção', 'Acertou depois de corrigir');
  return badge('bad', '✗ erro', 'Não acertou');
}

async function get(path) {
  const response = await fetch(path, { cache: 'no-store' });
  if (!response.ok) throw new Error(path + ': ' + response.status);
  return response.json();
}

// ── Endereço (#run=…&tab=…&test=…) ─────────────────────────────────────────
function readHash() {
  const params = new URLSearchParams(location.hash.slice(1));
  return { run: params.get('run'), tab: params.get('tab'), test: params.get('test') };
}
function writeHash() {
  const params = new URLSearchParams();
  if (state.run) params.set('run', state.run);
  params.set('tab', state.tab);
  if (state.selected) params.set('test', state.selected);
  history.replaceState(null, '', '#' + params.toString());
}

// ── Carga ──────────────────────────────────────────────────────────────────
async function loadRuns() {
  state.runs = (await get('/api/runs')).runs;
  const select = $('run');
  const options = state.runs.map((run) => h('option', { value: run.id },
    `${run.id} · ${run.done ?? 0}/${run.total ?? '?'}${run.simulated ? ' · simulada' : ''}`));
  if (select.options.length !== options.length || [...select.options].some((o, i) => o.textContent !== options[i].textContent)) {
    replace(select, options);
    if (state.run) select.value = state.run;
  }
  if (!state.run && state.runs.length) await openRun(state.runs[0].id);
  if (!state.runs.length && state.tab !== 'questions') replace($('view'), h('div', { class: 'empty' }, 'Nenhuma rodada nesta pasta ainda.'));
}

async function openRun(id) {
  Object.assign(state, { run: id, manifest: null, gold: new Map(), live: null, units: new Map(), order: [], next: 0,
    summary: null, summaryFor: '' });
  $('run').value = id;
  state.manifest = await get(`/api/runs/${id}/manifest`);
  try {
    for (const gold of await get(`/api/runs/${id}/gold`)) state.gold.set(gold.questionId + '|' + gold.paradigm, gold);
  } catch { /* rodada sem gabarito gravado */ }
  await refresh(true);
  writeHash();
}

async function refresh(force) {
  if (!state.run) return;
  const id = state.run;
  let changed = force;
  try {
    const live = await get(`/api/runs/${id}/live`);
    if (JSON.stringify(live) !== JSON.stringify(state.live)) { state.live = live; changed = true; }
  } catch { if (state.live) { state.live = null; changed = true; } }
  const page = await get(`/api/runs/${id}/units?from=${state.next}`);
  if (id !== state.run) return;
  if (page.next < state.next) { state.units = new Map(); state.order = []; state.next = 0; return refresh(true); }
  for (const record of page.units) {
    if (!state.units.has(record.key)) state.order.push(record.key);
    state.units.set(record.key, record);   // de um teste refeito vale a última linha
    changed = true;
  }
  state.next = page.next;
  renderHeader();
  // A aba de perguntas tem um formulário aberto: o andamento não a redesenha
  if (changed) { state.summaryFor = ''; if (state.tab !== 'questions') renderView(); }
}

// ── Cabeçalho e progresso ──────────────────────────────────────────────────
function renderHeader() {
  const live = state.live, manifest = state.manifest;
  const total = live?.total ?? manifest?.total ?? 0;
  const records = [...state.units.values()];
  const done = live?.done ?? records.length;
  const correct = live?.correct ?? records.filter((r) => r.correctFinal).length;
  const [label, kind] = ROUND[live?.status] || ['sem andamento gravado', 'plain'];
  const stale = live && live.status === 'running' ? Math.round((Date.now() - Date.parse(live.updatedAt)) / 1000) : 0;
  replace($('status'), badge(stale > 10 ? 'bad' : kind, stale > 10 ? 'sem sinal do processo' : label),
    manifest?.simulated ? [' ', badge('plain', 'simulada', 'Modelo e registro roteirizados, sem rede')] : null);
  $('signal').textContent = stale > 10 ? `última atualização há ${duration(stale)}` : '';
  const tile = (name, value, title) => h('div', { class: 'tile', title }, h('div', { class: 'label' }, name), h('div', { class: 'value' }, value));
  replace($('progress'),
    tile('Feitos', `${done} / ${total}`),
    tile('Acertos', correct),
    tile('Erros', live?.incorrect ?? done - correct),
    tile('Acurácia até agora', done ? percent(correct / done) : '-', `${correct} de ${done}`),
    tile('Não abriram', live?.notOpened ?? 0, live?.lastError ? 'Último erro: ' + live.lastError : 'Testes que nem abriram nesta execução'),
    tile('Falta (estimativa)', live?.status === 'running' ? duration(live.etaSeconds) : '-'));
  $('meter').style.width = total ? (100 * done / total).toFixed(1) + '%' : '0';
  const meter = $('meter').parentElement;
  meter.setAttribute('aria-valuenow', done); meter.setAttribute('aria-valuemax', total);
}

function renderTabs() {
  replace($('tabs'), TABS.map(([id, label]) => h('button', {
    role: 'tab', 'aria-selected': String(state.tab === id),
    onclick: () => { state.tab = id; writeHash(); renderTabs(); renderView(); },
  }, label)));
}

function renderView() {
  if (state.tab === 'questions') return viewQuestions();
  if (!state.manifest) return;
  const view = { live: viewLive, results: viewResults, summary: viewSummary, run: viewRun }[state.tab];
  view();
  if (state.selected) renderDetail();
}

// ── Ao vivo ────────────────────────────────────────────────────────────────
function unitHead(unit) {
  return [h('strong', {}, unit.questionId), badge('plain', unit.paradigm), badge('plain', unit.model),
    badge('plain', unit.language), badge('plain', 'rep. ' + unit.repetition), unit.difficulty ? badge('plain', unit.difficulty) : null];
}
function failureLine(attempt) {
  if (!attempt.failedStage) return null;
  return h('div', {}, badge('bad', '✗ falhou no ' + (FAILED_AT[attempt.failedStage] || attempt.failedStage)),
    attempt.failureClass ? [' ', h('span', { class: 'muted mono' }, attempt.failureClass)] : null);
}
function viewLive() {
  const live = state.live;
  const active = live?.status === 'running' ? live.active : [];
  const cards = active.map((unit) => {
    const index = STAGES.findIndex(([id]) => id === unit.stage);
    return h('div', { class: 'card' },
      h('div', { class: 'head' }, unitHead(unit)),
      h('div', { style: 'margin-top:6px' }, unit.question),
      h('div', { class: 'steps' }, STAGES.map(([id, label], position) =>
        h('span', { class: 'step' + (position === index ? ' now' : position < index ? ' done' : '') }, label)),
        STAGE_EXTRA[unit.stage] ? h('span', { class: 'step now' }, STAGE_EXTRA[unit.stage]) : null),
      unit.attempts.map((attempt, position) => h('div', {},
        h('div', { class: 'muted' }, `Tentativa ${position + 1}`, attempt.kind ? ' · ' + (KIND[attempt.kind] || attempt.kind) : ' · gerando…'),
        attempt.query ? h('pre', {}, attempt.query) : null,
        failureLine(attempt),
        attempt.error ? h('pre', { class: 'error' }, attempt.error) : null)));
  });
  const recent = state.order.slice(-10).reverse().map((key) => state.units.get(key));
  replace($('view'),
    h('h2', {}, 'Em andamento'),
    cards.length ? cards : h('div', { class: 'card muted' }, live?.status === 'running'
      ? 'Nenhum teste em andamento neste instante.'
      : 'A rodada não está em andamento. A linha de comando inicia e retoma; esta tela só acompanha.'),
    h('h2', {}, 'Últimos concluídos'),
    recent.length ? h('div', { class: 'tablewrap' }, h('table', {}, h('tbody', {}, recent.map((record) =>
      h('tr', { class: 'row', tabindex: 0, onclick: () => select(record.key), onkeydown: (e) => e.key === 'Enter' && select(record.key) },
        h('td', {}, verdict(record)), h('td', {}, h('strong', {}, record.questionId)),
        h('td', {}, record.paradigm), h('td', {}, record.model), h('td', {}, record.language),
        h('td', {}, STATUS[record.status] || record.status),
        h('td', { class: 'num' }, record.attempts.length + ' tent.'), h('td', { class: 'num' }, seconds(record.turnMs)))))))

  if (form.decimals !== '') compare.decimals = Number(form.decimals);
  // Os campos que a tela não edita voltam como estavam
  const kept = desk.set.questions.find((q) => q.id === desk.replaces) || {};

    source: form.source || null, unanswerable: Boolean(form.unanswerable), gold };
  if (kept.paradigms) question.paradigms = kept.paradigms;

  const input = kind === 'area' || kind === 'prose'
    ? h('textarea', { class: kind === 'prose' ? 'prose' : '', rows: options?.rows || 3, spellcheck: 'false' })
    : kind === 'select' ? h('select', {}, options.values.map(([value, text]) => h('option', { value }, text)))
    : h('input', { type: 'text', list: options?.list });
  input.value = form[key] ?? '';
  input.addEventListener('input', () => { form[key] = input.value; });
  if (desk.set.readOnly) input.disabled = true;
  return h('div', {}, h('label', {}, label), input);
}
function goldField(paradigm) {
  const area = h('textarea', { rows: paradigm === 'postgres' ? 5 : 8, spellcheck: 'false',
    placeholder: desk.form.unanswerable ? 'pergunta sem resposta: sem gabarito' : 'sem gabarito neste paradigma' });
  area.value = desk.form.gold[paradigm] || '';
  area.addEventListener('input', () => { desk.form.gold[paradigm] = area.value; });
  if (desk.set.readOnly) area.disabled = true;
  return h('div', {}, h('label', {}, 'Gabarito: ' + paradigm), area);
}
function renderForm() {
  const panel = $('qform');
  if (!panel) return;
  const form = desk.form;
  if (!form) {
    replace(panel, h('div', { class: 'empty' }, 'Escolha uma pergunta do conjunto ou do catálogo, ou crie uma nova.'));
    return;
  }
  const entry = desk.catalog.find((e) => e.source === form.source);
  const flag = h('input', { type: 'checkbox' });
  flag.checked = Boolean(form.unanswerable);
  flag.addEventListener('change', () => { form.unanswerable = flag.checked; });
  const messages = desk.messages && h('div', { class: 'note ' + desk.messages.kind }, h('strong', {}, desk.messages.title),
    desk.messages.items.length ? h('ul', {}, desk.messages.items.map((item) => h('li', {}, item))) : null);
  const checked = desk.checked && h('div', {},
    desk.checked.problems.length ? h('div', { class: 'note bad' }, h('strong', {}, 'Gabarito com problema:'),
      h('ul', {}, desk.checked.problems.map((item) => h('li', {}, item)))) : null,
    desk.checked.warnings.length ? h('div', { class: 'note warn' }, h('strong', {}, 'Avisos:'),
      h('ul', {}, desk.checked.warnings.map((item) => h('li', {}, item)))) : null,
    desk.checked.ok && !desk.checked.warnings.length ? h('div', { class: 'note ok' }, '✓ Os gabaritos rodaram duas vezes com o mesmo resultado e os paradigmas concordam.') : null,
    h('div', { class: 'sides' }, desk.checked.results.map((result) => h('div', {},
      h('div', { class: 'muted' }, `${result.paradigm} · ${result.rowCount} linha(s)`),
      grid({ columns: result.columns, rows: result.rows, truncated: result.rowCount > result.rows.length })))));
  replace(panel,
    h('div', { class: 'head', style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap' },
      h('strong', {}, desk.replaces ? 'Editar ' + desk.replaces : 'Nova pergunta'),
      desk.replaces ? badge('info', 'no conjunto') : badge('plain', 'ainda não gravada'),
      entry ? badge(...catalogStatus(entry)) : null),
    h('div', { class: 'row' },
      field2('Id', 'id'), field2('Banco (dataset)', 'dataset', 'text', { list: 'datasets' }),
      field2('Dificuldade', 'difficulty', 'text', { list: 'difficulties' }), field2('Origem', 'source')),
    field2('Texto em inglês', 'en', 'prose', { rows: 2 }),
    field2('Texto em português', 'pt', 'prose', { rows: 2 }),
    entry?.evidence ? h('div', { class: 'note info' }, h('strong', {}, 'Dica do benchmark (não vai para o modelo): '), entry.evidence,
      h('div', { class: 'muted' }, 'O app não tem campo para a dica. Se a pergunta depende dela, escreva a informação no próprio texto.')) : null,
    entry?.otherQuestion ? h('div', { class: 'note warn' }, 'O gabarito do MongoDB foi escrito para outro texto: ', h('em', {}, entry.otherQuestion)) : null,
    h('label', { class: 'check', style: 'display:inline-flex;margin-top:10px;color:var(--fg)' }, flag,
      'Pergunta sem resposta possível (o acerto é pedir esclarecimento)'),
    PARADIGMS.map(goldField),
    h('div', { class: 'row' },
      field2('Ordem das linhas', 'order', 'select', { values: [['', 'padrão do conjunto'], ['ignore', 'não importa'], ['strict', 'tem que ser a mesma']] }),
      field2('Casas decimais', 'decimals')),
    desk.set.readOnly ? h('div', { class: 'note info' }, 'A tela foi aberta com --read-only: sem cadastro.') : h('div', { class: 'actions' },
      h('button', { class: 'btn primary', onclick: saveForm, disabled: desk.busy }, 'Gravar'),
      h('button', { class: 'btn', onclick: checkForm, disabled: desk.busy || !desk.replaces,
        title: 'Executa cada gabarito duas vezes nos bancos de teste (só leitura) e compara os paradigmas' }, 'Conferir nos bancos'),
      desk.replaces ? h('button', { class: 'btn danger', onclick: deleteForm, disabled: desk.busy }, 'Tirar do conjunto') : null,
      desk.busy ? h('span', { class: 'muted' }, 'aguarde…') : null),
    messages, checked);
}
function renderDesk() {
  const problems = new Map();
  for (const problem of desk.set.problems) {
    const key = problem.question || '';
    problems.set(key, [...(problems.get(key) || []), problem.message]);
  }
  const distinct = (pick) => [...new Set(desk.catalog.map(pick).filter(Boolean))].sort();
  const select = (key, label, values) => {
    const node = h('select', { 'aria-label': label, onchange: (e) => { desk.filters[key] = e.target.value; desk.shown = 100; renderDesk(); } },
      values.map(([value, text]) => h('option', { value }, text)));
    node.value = desk.filters[key];
    return node;
  };
  const mode = (id, label) => h('button', { 'aria-pressed': String(desk.mode === id), onclick: () => { desk.mode = id; renderDesk(); } }, label);
  let list;
  if (desk.mode === 'set') {
    list = desk.set.questions.length ? desk.set.questions.map((q) => h('div', {
      class: 'item' + (desk.replaces === q.id ? ' selected' : ''), tabindex: 0, onclick: () => openForm(fromSet(q), q.id),
    },
      h('div', { class: 'head' }, h('strong', {}, q.id), q.dataset ? badge('plain', q.dataset) : null, badge('plain', q.difficulty),
        q.unanswerable ? badge('info', 'sem resposta') : Object.keys(q.gold || {}).map((p) => badge('plain', p)),
        problems.has(q.id) ? badge('bad', 'com problema', problems.get(q.id).join('; ')) : null),
      h('div', { class: 'muted question', style: 'max-width:none' }, q.pt)))
      : h('div', { class: 'empty' }, 'O conjunto está vazio. Escolha perguntas no catálogo.');
  } else {
    const rows = catalogRows();
    list = rows.length ? [rows.slice(0, desk.shown).map((entry) => h('div', {
      class: 'item' + (desk.form?.source === entry.source && !desk.replaces ? ' selected' : ''), tabindex: 0,
      onclick: () => openForm(fromCatalog(entry), null),
    },
      h('div', { class: 'head' }, h('strong', {}, entry.source), badge('plain', entry.dataset),
        entry.difficulty ? badge('plain', entry.difficulty) : null, badge(...catalogStatus(entry)),
        entry.evidence ? null : badge('info', 'sem dica')),
      h('div', { class: 'muted' }, entry.question))),
      rows.length > desk.shown ? h('div', { class: 'item muted', onclick: () => { desk.shown += 200; renderDesk(); } },
        `Mostrar mais (${rows.length - desk.shown} restantes)`) : null]
      : h('div', { class: 'empty' }, desk.catalog.length ? 'Nenhuma pergunta do catálogo com esses filtros.'
        : 'Sem catálogo. Rode: ./experiment/db.sh download e ./experiment/x catalog');
  }
  const search = h('input', { type: 'search', id: 'qsearch', placeholder: 'Buscar no texto ou no id', 'aria-label': 'Buscar no catálogo',
    value: desk.filters.text, oninput: (e) => {
      desk.filters.text = e.target.value; desk.shown = 100; renderDesk();
      // A lista foi redesenhada: o cursor volta para a busca
      const again = $('qsearch'); again.focus(); again.setSelectionRange(again.value.length, again.value.length);
    } });
  const hide = h('input', { type: 'checkbox', onchange: (e) => { desk.filters.hide = e.target.checked; renderDesk(); } });
  hide.checked = desk.filters.hide;
  replace($('view'),
    h('datalist', { id: 'datasets' }, distinct((e) => e.dataset).map((value) => h('option', { value }))),
    h('datalist', { id: 'difficulties' }, ['simple', 'moderate', 'challenging'].map((value) => h('option', { value }))),
    h('div', { class: 'desk' },
      h('div', {},
        h('div', { class: 'switch' }, mode('set', `Conjunto (${desk.set.questions.length})`), mode('catalog', `Catálogo (${desk.catalog.length})`),
          desk.set.readOnly ? null : h('button', { onclick: () => openForm(blankQuestion(), null) }, '+ Nova pergunta')),
        desk.mode === 'catalog' ? h('div', { class: 'filters', style: 'margin:0 0 8px' },
          select('status', 'Situação', [['agree', 'paradigmas de acordo'], ['differ', 'respostas diferentes'], ['broken', 'gabarito não serve'],
            ['mongo', 'só MongoDB'], ['', 'todas']]),
          select('dataset', 'Banco', [['', 'todos os bancos'], ...distinct((e) => e.dataset).map((value) => [value, value])]),
          select('difficulty', 'Dificuldade', [['', 'toda dificuldade'], ...distinct((e) => e.difficulty).map((value) => [value, value])]),
          h('label', { class: 'check' }, hide, 'esconder as já cadastradas'), search,
          h('span', { class: 'muted' }, `${catalogRows().length} pergunta(s)`)) : null,
        problems.has('') ? h('div', { class: 'note bad' }, problems.get('').join('; ')) : null,
        h('div', { class: 'list' }, list),
        h('p', { class: 'muted' }, 'Arquivo: ', h('span', { class: 'mono' }, desk.set.path))),
      h('div', { class: 'form', id: 'qform' })));
  renderForm();
}
async function viewQuestions() {
  if (!desk.set) {
    replace($('view'), h('div', { class: 'empty' }, 'Carregando as perguntas…'));
    try { await loadDesk(); } catch (error) {
      replace($('view'), h('div', { class: 'empty' }, 'Não foi possível ler o conjunto de perguntas: ' + error.message));
      return;
    }
    if (state.tab !== 'questions') return;
  }
  renderDesk();
}

// ── Partida ────────────────────────────────────────────────────────────────
$('run').addEventListener('change', (e) => { state.selected = null; $('detail').hidden = true; openRun(e.target.value); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.selected) closeDetail(); });
async function tick() {
  try { await loadRuns(); await refresh(false); } catch (error) { $('signal').textContent = 'sem resposta do servidor da tela'; }
  setTimeout(tick, state.live?.status === 'running' ? 1000 : 4000);
}
(async () => {
  const start = readHash();
  if (start.tab && TABS.some(([id]) => id === start.tab)) state.tab = start.tab;
  renderTabs();
  try {
    await loadRuns();
    if (start.run && state.runs.some((run) => run.id === start.run) && start.run !== state.run) await openRun(start.run);
    if (start.test && state.units.has(start.test)) { state.selected = start.test; renderDetail(); }
    if (state.tab === 'questions') renderView();
    writeHash();
  } catch (error) { $('signal').textContent = 'sem resposta do servidor da tela'; }
  setTimeout(tick, 1000);
})();
</script>
</body>
</html>
