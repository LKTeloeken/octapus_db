# Conjunto de perguntas do experimento. Formato: src-tauri/src/experiment/questions.rs
# 200 perguntas do BIRD Mini-Dev + AptMQL-Bench, escolhidas por experiment/selecionar.py
# (critérios no cabeçalho do script; todas as 1.450 em experiment/perguntas-todas.csv).
# O texto em inglês é o do BIRD; o português é uma tradução revisada à mão.
# O Redis tem os dados do PostgreSQL (./experiment/x redis-load): o gabarito dele é o
# resultado do gabarito do PostgreSQL (same_as).
# No fim, 22 perguntas sem resposta possível, escritas pelo autor (2 por banco):
# o dado não existe em nenhuma tabela, e o acerto é o turno pedir esclarecimento.

version = "2026-11-bird-200-sr-22"

# Comparação Soft-EX, como no AptMQL-Bench: o resultado pode ter colunas a mais,
# desde que as do gabarito estejam lá (a saída do Redis sempre traz a coluna do
# item; a regra vale igual para os três bancos). O resultado obtido fica gravado
# inteiro, então a versão estrita (BIRD) pode ser recalculada depois.
[defaults.compare]
extra_columns = "allow"

[[question]]
id = "bird_5"
difficulty = "simple"
dataset = "california_schools"
source = "bird:5"
pt = "Quantas escolas com nota média em Matemática acima de 400 no SAT são exclusivamente virtuais?"
en = "How many schools with an average score in Math greater than 400 in the SAT test are exclusively virtual?"
[question.gold.postgres]
query = '''
SELECT COUNT(DISTINCT T2.School) FROM satscores AS T1 INNER JOIN schools AS T2 ON T1.cds = T2.CDSCode WHERE T2.Virtual = 'F' AND T1.AvgScrMath > 400
'''
[question.gold.mongodb]
query = '''
{
  "collection": "schools",
  "operation": "aggregate",
  "pipeline": [
    {
      "$match": {
        "characteristics.virtual": "F",
        "satScores.avgScoreMath": {
          "$gt": 400
        }
      }
    },
    {
      "$count": "count"
    }
  ]
}
'''
[question.gold.redis]
same_as = "postgres"

[[question]]
id = "bird_12"
difficulty = "moderate"
dataset = "california_schools"
source = "bird:12"
pt = "Entre as escolas com taxa de excelência no SAT acima de 0,3, qual é a maior taxa de elegibilidade à merenda gratuita para alunos de 5 a 17 anos?"
en = "Among the schools with an SAT excellence rate of over 0.3, what is the highest eligible free rate for students aged 5-17?"
[question.gold.postgres]
query = '''
SELECT MAX(CAST(T1."Free Meal Count (Ages 5-17)" AS REAL) / NULLIF(T1."Enrollment (Ages 5-17)", 0)) FROM frpm AS T1 INNER JOIN satscores AS T2 ON T1.CDSCode = T2.cds WHERE CAST(T2.NumGE1500 AS REAL) / NULLIF(T2.NumTstTakr, 0) > 0.3
'''
[question.gold.mongodb]
query = '''
{
  "collection": "schools",
  "operation": "aggregate",
  "pipeline": [
    {
      "$match": {
        "frpm": {
          "$exists": true
        },
        "satScores": {
          "$exists": true
        },
        "satScores.excellenceRate": {
          "$gt": 0.3
        }
      }
    },
    {
      "$project": {
        "_id": 0,
        "freeMealRate": {
          "$cond": {
            "if": {
              "$and": [
                {
                  "$ne": [
                    "$frpm.enrollmentAges5to17.enrollment",
                    null
                  ]
                },
                {
                  "$gt": [
                    "$frpm.enrollmentAges5to17.enrollment",
                    0
                  ]
                }
              ]
            },
            "then": {
              "$divide": [
                {
                  "$ifNull": [
                    "$frpm.enrollmentAges5to17.freeMealCount",
                    null
                  ]
                },
                "$frpm.enrollmentAges5to17.enrollment"
              ]
            },
            "else": null
          }
        }
      }
    },
    {
      "$group": {
        "_id": null,
        "max_free_meal_rate": {
          "$max": "$freeMealRate"
        }
      }
    },
    {
      "$project": {
        "_id": 0,
        "max_free_meal_rate": 1
      }
    }
  ]
}
'''
[question.gold.redis]
same_as = "postgres"

[[question]]
id = "bird_26"
difficulty = "moderate"
dataset = "california_schools"
source = "bird:26"
pt = "Informe o nome e o endereço completo de correspondência das escolas de ensino médio em Monterey que têm mais de 800 refeições gratuitas ou com preço reduzido para alunos de 15 a 17 anos."
en = "State the names and full communication address of high schools in Monterey which has more than 800 free or reduced price meals for ages 15-17?"
[question.gold.postgres]
query = '''
SELECT T1."School Name", T2.Street, T2.City, T2.State, T2.Zip FROM frpm AS T1 INNER JOIN schools AS T2 ON T1.CDSCode = T2.CDSCode WHERE T2.County = 'Monterey' AND T1."Free Meal Count (Ages 5-17)" > 800 AND T1."School Type" = 'High Schools (Public)'
'''
[question.gold.mongodb]
query = '''
{
  "collection": "schools",
  "operation": "aggregate",
  "pipeline": [
    {
      "$match": {
        "location.county": "Monterey",
        "frpm.schoolType": "High Schools (Public)",
        "frpm.enrollmentAges5to17.freeMealCount": {
          "$gt": 800
        }
      }
    },
    {
      "$project": {
        "_id": 0,
        "School Name": "$location.school",
        "Street": "$location.street",
        "City": "$location.city",
        "State": "$location.state",
        "Zip": "$location.zip"
      }
    }
  ]
}
'''
[question.gold.redis]
same_as = "postgres"

[[question]]
id = "bird_28"
difficulty = "challenging"
dataset = "california_schools"
source = "bird:28"
pt = "Considerando a diferença média entre a matrícula do K-12 e a matrícula de 15 a 17 anos das escolas com financiamento local, liste o nome e o tipo DOC das escolas cuja diferença fica acima dessa média."
en = "Consider the average difference between K-12 enrollment and 15-17 enrollment of schools that are locally funded, list the names and DOC type of schools which has a difference above this average."
[question.gold.postgres]
query = '''
SELECT T2.School, T2.DOC FROM frpm AS T1 INNER JOIN schools AS T2 ON T1.CDSCode = T2.CDSCode WHERE T2.FundingType = 'Locally funded' AND (T1."Enrollment (K-12)" - T1."Enrollment (Ages 5-17)") > (SELECT AVG(T3."Enrollment (K-12)" - T3."Enrollment (Ages 5-17)") FROM frpm AS T3 INNER JOIN schools AS T4 ON T3.CDSCode = T4.CDSCode WHERE T4.FundingType = 'Locally funded')
'''
[question.gold.mongodb]
query = '''
{
  "collection": "schools",
  "operation": "aggregate",
  "pipeline": [
    {
      "$match": {
        "frpm": {
          "$exists": true
        },
        "characteristics.charterFundingType": "Locally funded"
      }
    },
    {
      "$addFields": {
        "enrollmentDiff": {
          "$cond": {
            "if": {
              "$and": [
                {
                  "$ne": [
                    "$frpm.enrollmentK12.enrollment",
                    null
                  ]
                },
                {
                  "$ne": [
                    "$frpm.enrollmentAges5to17.enrollment",
                    null
                  ]
                }
              ]
            },
            "then": {
              "$subtract": [
                "$frpm.enrollmentK12.enrollment",
                "$frpm.enrollmentAges5to17.enrollment"
              ]
            },
            "else": null
          }
        }
      }
    },
    {
      "$group": {
        "_id": null,
        "avgDiff": {
          "$avg": "$enrollmentDiff"
        },
        "schools": {
          "$push": {
            "school": "$location.school",
            "doc": "$classification.doc",
            "enrollmentDiff": "$enrollmentDiff"
          }
        }
      }
    },
    {
      "$unwind": "$schools"
    },
    {
      "$match": {
        "$expr": {
          "$and": [
            {
              "$ne": [
                "$schools.enrollmentDiff",
                null
              ]
            },
            {
              "$gt": [
                "$schools.enrollmentDiff",
                "$avgDiff"
              ]
            }
          ]
        }
      }
    },
    {
      "$project": {
        "_id": 0,
        "School": "$schools.school",
        "DOC": "$schools.doc"
      }
    }
  ]
}
'''
[question.gold.redis]
same_as = "postgres"

