en = "What is the average number of bonds the atoms with the element iodine have?"
[question.gold.postgres]
query = '''
SELECT CAST(COUNT(T2.bond_id) AS REAL) / NULLIF(COUNT(T1.atom_id), 0) FROM atom AS T1 INNER JOIN connected AS T2 ON T1.atom_id = T2.atom_id WHERE T1.element = 'i'
'''
[question.gold.mongodb]
query = '''
{
  "collection": "molecules",
  "operation": "aggregate",
  "pipeline": [
    {
      "$match": {
        "atoms.element": "i"
      }
    },
    {
      "$project": {
        "iodine_atoms": {
          "$filter": {
            "input": "$atoms",
            "as": "atom",
            "cond": {
              "$eq": [
                "$$atom.element",
                "i"
              ]
            }
          }
        },
        "bonds": 1
      }
    },
    {
      "$project": {
        "atom_bond_pairs": {
          "$map": {
            "input": "$iodine_atoms",
            "as": "iodine_atom",
            "in": {
              "atom_id": "$$iodine_atom._id",
              "bond_count": {
                "$size": {
                  "$filter": {
                    "input": "$bonds",
                    "as": "bond",
                    "cond": {
                      "$or": [
                        {
                          "$eq": [
                            "$$bond.atom_id_1",
                            "$$iodine_atom._id"
                          ]
                        },
                        {
                          "$eq": [
                            "$$bond.atom_id_2",
                            "$$iodine_atom._id"
                          ]
                        }
                      ]
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    {
      "$unwind": "$atom_bond_pairs"
    },
    {
      "$group": {
        "_id": null,
        "total_bonds": {
          "$sum": "$atom_bond_pairs.bond_count"
        },
        "total_atoms": {
          "$sum": 1
        }
      }
    },
    {
      "$project": {
        "_id": 0,
        "ratio": {
          "$divide": [
            "$total_bonds",
            "$total_atoms"
          ]
        }
      }
    }
  ]
}
'''
[question.gold.redis]
same_as = "postgres"

[[question]]
id = "bird_247"
difficulty = "challenging"
dataset = "toxicology"
source = "bird:247"
pt = "Liste todos os elementos dos átomos que não se ligam a nenhum outro átomo."
en = "List all the elements of atoms that can not bond with any other atoms."
[question.gold.postgres]
query = '''
SELECT DISTINCT T.element FROM atom AS T WHERE NOT T.element IN (SELECT DISTINCT T1.element FROM atom AS T1 INNER JOIN connected AS T2 ON T1.atom_id = T2.atom_id)
'''
[question.gold.mongodb]
query = '''
{
  "collection": "molecules",
  "operation": "aggregate",
  "pipeline": [
    {
      "$facet": {
        "allElements": [
          {
            "$unwind": "$atoms"
          },
          {
            "$group": {
              "_id": "$atoms.element"
            }
          }
        ],
        "connectedElements": [
          {
            "$project": {
              "connectedAtoms": {
                "$reduce": {
                  "input": "$bonds",
                  "initialValue": [],
                  "in": {
                    "$concatArrays": [
                      "$$value",
                      [
                        "$$this.atom_id_1",
                        "$$this.atom_id_2"
                      ]
                    ]
                  }
                }
              },
              "atoms": "$atoms"
            }
          },
          {
            "$project": {
              "connectedAtomElements": {
                "$map": {
                  "input": {
                    "$filter": {
                      "input": "$atoms",
                      "as": "atom",
                      "cond": {
                        "$in": [
                          "$$atom._id",
                          "$connectedAtoms"
                        ]
                      }
                    }
                  },
                  "as": "atom",
                  "in": "$$atom.element"
                }
              }
            }
          },
          {
            "$unwind": "$connectedAtomElements"
          },
          {
            "$group": {
              "_id": "$connectedAtomElements"
            }
          }
        ]
      }
    },
    {
      "$project": {
        "element": {
          "$setDifference": [
            {
              "$map": {
                "input": "$allElements",
                "as": "e",
                "in": "$$e._id"
              }
            },
            {
              "$map": {
                "input": "$connectedElements",
                "as": "e",
                "in": "$$e._id"
              }
            }
          ]
        }
      }
    },
    {
      "$unwind": "$element"
    },
    {
      "$sort": {
        "element": 1
      }
    }
  ]
}
'''
[question.gold.redis]
same_as = "postgres"

