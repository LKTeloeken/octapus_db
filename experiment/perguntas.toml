[[question]]
id = "bird_48"
difficulty = "moderate"
dataset = "california_schools"
source = "bird:48"
pt = "Qual é a razão entre as escolas fundidas do Unified School District no condado de Orange e as escolas fundidas do Elementary School District?"
en = "What is the ratio of merged Unified School District schools in Orange County to merged Elementary School District schools?"
[question.gold.postgres]
query = '''
SELECT CAST(SUM(CASE WHEN DOC::integer = 54 THEN 1 ELSE 0 END) AS REAL) / NULLIF(SUM(CASE WHEN DOC::integer = 52 THEN 1 ELSE 0 END), 0) FROM schools WHERE StatusType = 'Merged' AND County = 'Orange'
'''
[question.gold.mongodb]
query = '''
{
  "collection": "schools",
  "operation": "aggregate",
  "pipeline": [
    {
      "$match": {
        "statusType": "Merged",
        "location.county": "Orange"
      }
    },
    {
      "$group": {
        "_id": null,
        "count_doc_54": {
          "$sum": {
            "$cond": [
              {
                "$eq": [
                  "$classification.doc",
                  "54"
                ]
              },
              1,
              0
            ]
          }
        },
        "count_doc_52": {
          "$sum": {
            "$cond": [
              {
                "$eq": [
                  "$classification.doc",
                  "52"
                ]
              },
              1,
              0
            ]
          }
        }
      }
    },
    {
      "$project": {
        "_id": 0,
        "ratio": {
          "$divide": [
            "$count_doc_54",
            "$count_doc_52"
          ]
        }
      }
    }
  ]
}
'''
[question.gold.redis]
same_as = "postgres"

