  "collection": "patients",
  "operation": "aggregate",
  "pipeline": [
    {
      "$match": {
        "sex": "M"
      }
    },
    {
      "$group": {
        "_id": null,
        "admissionPlus": {
          "$sum": {
            "$cond": [
              {
                "$eq": [
                  "$admission",
                  "+"
                ]
              },
              1,
              0
            ]
          }
        },
        "admissionMinus": {
          "$sum": {
            "$cond": [
              {
                "$eq": [
                  "$admission",
                  "-"
                ]
              },
              1,
              0
            ]
          }
        }
      }
    },
    {
      "$project": {
        "_id": 0,
        "ratio_percentage": {
          "$multiply": [
            {
              "$divide": [
                "$admissionPlus",
                "$admissionMinus"
              ]
            },
            100
          ]
        }
      }
    }
  ]
}
'''
