[[question]]
id = "bird_260"
difficulty = "moderate"
dataset = "toxicology"
source = "bird:260"
pt = "Calcule o total de átomos das moléculas com ligação tripla que contêm o elemento fósforo ou bromo."
en = "Calculate the total atoms with triple-bond molecules containing the element phosphorus or bromine."
[question.gold.postgres]
query = '''
SELECT COUNT(T1.atom_id) FROM atom AS T1 INNER JOIN molecule AS T2 ON T1.molecule_id = T2.molecule_id INNER JOIN bond AS T3 ON T2.molecule_id = T3.molecule_id WHERE T3.bond_type = '#' AND T1.element IN ('p', 'br')
'''
[question.gold.mongodb]
query = '''
{
  "collection": "molecules",
  "operation": "aggregate",
  "pipeline": [
    {
      "$match": {
        "statistics.bondTypeCounts.#": {
          "$gt": 0
        }
      }
    },
    {
      "$unwind": "$atoms"
    },
    {
      "$match": {
        "atoms.element": {
          "$in": [
            "p",
            "br"
          ]
        }
      }
    },
    {
      "$count": "count"
    }
  ]
}
'''
[question.gold.redis]
same_as = "postgres"

