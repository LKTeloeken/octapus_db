  "collection": "schools",
  "operation": "aggregate",
  "pipeline": [
    {
      "$match": {
        "classification.doc": "52",
        "location.county": "Alameda",
        "openDate": {
          "$gte": "1980-01-01",
          "$lt": "1981-01-01"
        }
      }
    },
    {
      "$count": "schoolCount"
    },
    {
      "$project": {
        "_id": 0,
        "monthlyAverage": {
          "$divide": [
            "$schoolCount",
            12
          ]
        }
      }
    }
  ]
}
'''
[question.gold.redis]
