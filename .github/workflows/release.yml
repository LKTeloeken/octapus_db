name: Release

# Publica os bundles das 3 plataformas numa GitHub Release e gera o
# latest.json que o updater do app consome.
#
# Cada versão nasce de uma tag `app-v<versão>` (ver "Lançar uma versão" no
# README): a release é o build exato daquele commit, e a tag fica como ponto
# de volta para um rollback. O workflow_dispatch serve para refazer o build de
# uma tag que já existe — escolha a tag em "Use workflow from".
on:
  push:
    tags: ['app-v*']
  workflow_dispatch:

jobs:
  # Antes de gastar 4 builds: a tag tem que ser `app-v<versão>` e bater com a
  # versão gravada nos arquivos do app (package.json, Cargo.toml, Cargo.lock,
  # tauri.conf.json) — é ela que o updater compara e que vai no latest.json.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir a tag com a versão do app
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Rode a partir de uma tag app-v<versão>, não da branch $TAG"
            exit 1
          fi
          node scripts/release-version.mjs check "$TAG"

  release:
    needs: version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # `label` nomeia as cópias de nome fixo publicadas ao final do job,
        # que dão à landing page links de download permanentes.
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            label: macos-x64
          - platform: ubuntu-22.04
            target: ''
            args: ''
            label: linux-x86_64
          # Só NSIS: o bundler do MSI rejeita pre-release não-numérico
          # (`-beta.2`), restrição que existe apenas no target msi.
          - platform: windows-latest
            target: ''
            args: --bundles nsis
            label: windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # WebKit + libdbus (keyring) são pré-requisitos do Tauri no Linux.
      # Não adicione `libappindicator3-dev`: ele conflita com o
      # `libayatana-appindicator3-dev`, que é o sucessor usado pelo Tauri 2.
      - name: Instalar dependências de sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            pkg-config

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache do Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências do frontend
        run: pnpm install --frozen-lockfile

      # Versão com sufixo (`1.1.0-beta.2`) sai como pre-release: o endpoint
      # estável do updater (`releases/latest`) não a enxerga, só quem ligou o
      # canal beta nas configurações do app (commands/updater.rs).
      - name: Canal da versão
        id: channel
        shell: bash
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "$version -> prerelease=$([[ "$version" == *-* ]] && echo true || echo false)"

      - name: Build e publicação da release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # URL da API do assistente, embutida no binário (src-tauri/build.rs e
          # assistant/config.rs). Sem a variável do repositório, o app sai sem
          # assistente e o resto funciona igual.
          OCTAPUS_ASSISTANT_URL: ${{ vars.OCTAPUS_ASSISTANT_URL }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: octapus-db v__VERSION__
          releaseBody: |
            Instalação e notas desta versão.

            > **macOS:** o app é assinado ad-hoc, sem certificado da Apple. Ao
            > baixar o `.dmg` pelo navegador, o Gatekeeper bloqueia na primeira
            > abertura — libere em **Ajustes do Sistema → Privacidade e
            > Segurança → Abrir Mesmo Assim**. (No Sequoia o antigo atalho de
            > clique-direito → Abrir não funciona mais.)
          # Sai como rascunho para revisão; ao publicar, uma versão estável vira
          # a release "latest" que o endpoint do updater consulta, e uma beta
          # fica como pre-release (só o canal beta a vê).
          releaseDraft: true
          prerelease: ${{ steps.channel.outputs.prerelease }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # Os instaladores levam a versão no nome, então a URL muda a cada
      # release. Aqui sobe uma cópia de cada um com nome fixo, para a landing
      # page poder usar links permanentes do tipo
      # /releases/latest/download/octapus-db-macos-arm64.dmg
      - name: Publicar cópias com nome fixo
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          TAG: ${{ github.ref_name }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          mkdir -p stable-names
          enviados=0

          while IFS= read -r path; do
            # O jq do Windows escreve CRLF: sem remover o \r nenhum padrão casa.
            path="${path%$'\r'}"
            # Normaliza D:\a\... para D:/a/..., que o bash do Git trata melhor.
            path="${path//\\//}"
            [ -n "$path" ] || continue

            # Só instaladores: artefatos do updater (.tar.gz/.zip) e .sig ficam de fora.
            case "$path" in
              *-setup.exe) ext=exe ;;
              *.dmg)       ext=dmg ;;
              *.AppImage)  ext=AppImage ;;
              *.deb)       ext=deb ;;
              *.rpm)       ext=rpm ;;
              *)           echo "ignorado: $path"; continue ;;
            esac

            stable="stable-names/octapus-db-${LABEL}.${ext}"
            cp "$path" "$stable"
            echo "$(basename "$path")  ->  $(basename "$stable")"
            gh release upload "$TAG" "$stable" --clobber --repo "$GITHUB_REPOSITORY"
            enviados=$((enviados + 1))
          done < <(printf '%s' "$ARTIFACT_PATHS" | jq -r '.[]')

          # Sem isso, um padrão que pare de casar falha em silêncio.
          if [ "$enviados" -eq 0 ]; then
            echo "::error::Nenhum instalador reconhecido em ARTIFACT_PATHS: $ARTIFACT_PATHS"
            exit 1
          fi
